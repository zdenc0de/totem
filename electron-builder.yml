appId: mx.conaip.totem.talento
productName: Totem Talento
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{AGENTS.md,BITACORAS.md}'
  - '!.claude/**'
  # Los logos ya van dentro de out/renderer/assets (Vite los empaqueta).
  - '!assets/**'
  # La página del QR (web/) se publica aparte; no va dentro de la app del tótem.
  - '!web/**'
  # La demo web para revisión (demo/) tampoco.
  - '!demo/**'
  - '!{vite.demo.config.ts,tsconfig.demo.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# content.json va junto al ejecutable (resources/) para poder editarse sin recompilar (§12).
extraResources:
  - from: resources/content.json
    to: content.json
win:
  executableName: totem-talento
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
# Sin publicación: el tótem no debe buscar actualizaciones (cero red). `null` explícito, porque
# si no, electron-builder deduce GitHub del remoto de git y genera resources/app-update.yml.
publish: null
