<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c53a2" />
    <title>Talento Acelerador · CONAIP × Eliot Awards</title>
    <meta
      name="description"
      content="Tu tipo de talento es Acelerador. Tu reto: Simulador de carreras."
    />
    <link rel="preload" href="/assets/img/retos/acelerador.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="/assets/css/estilos.css" />
  </head>
  <!-- Las tres páginas de talento son iguales salvo estos datos: si se cambia una, cambiar las tres. -->
  <body data-talento="acelerador">
    <main class="reto">
      <p class="reto__intro">Acelerador, tu reto es:</p>
      <img
        class="reto__boleto"
        src="/assets/img/retos/acelerador.webp"
        width="1032"
        height="1859"
        alt="Tu tipo de talento es Acelerador. Tu reto: Simulador de carreras."
      />

      <div class="reto__acciones">
        <p id="aviso" class="reto__aviso" role="status"></p>
        <button id="historia" class="boton boton--principal" type="button">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
          Compartir en mi historia
        </button>
        <button id="guardar" class="boton boton--secundario" type="button">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 4v11" />
            <path d="m7 10 5 5 5-5" />
            <path d="M5 20h14" />
          </svg>
          Guardar imagen
        </button>
      </div>

      <div class="pie">
        <p class="pie__texto">Etiquétanos en tu historia</p>
        <a class="red" href="https://www.instagram.com/conaip_mx/">
          <span class="red__contenido">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            @CONAIP_MX
          </span>
        </a>
      </div>
    </main>
    <script src="/assets/js/compartir.js" defer></script>
  </body>
</html>
