<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Talento Impulsor · CONAIP × Eliot Awards</title>
    <meta name="description" content="Tu tipo de talento es Impulsor. Tu reto: Pera de box." />
    <link rel="preload" href="/assets/img/retos/impulsor.webp" as="image" type="image/webp" />
    <link
      rel="preload"
      href="/assets/fonts/poppins-latin-900-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/css/estilos.css" />
  </head>
  <!-- Las tres páginas de talento son iguales salvo estos datos: si se cambia una, cambiar las tres. -->
  <body data-talento="impulsor">
    <header class="banda">
      <img
        class="banda__conaip"
        src="/assets/img/logos/conaip.svg"
        width="858"
        height="196"
        alt="CONAIP"
      />
      <span class="banda__division" aria-hidden="true"></span>
      <img
        class="banda__eliot"
        src="/assets/img/logos/eliot.svg"
        width="386"
        height="232"
        alt="Eliot Awards"
      />
    </header>

    <main class="reto">
      <div class="reto__texto">
        <p class="reto__intro">Impulsor, tu reto es:</p>
        <h1 class="reto__juego" data-texto="Pera de box">Pera de box</h1>
      </div>

      <img
        class="reto__boleto"
        src="/assets/img/retos/impulsor.webp"
        width="1032"
        height="1859"
        alt="Tu tipo de talento es Impulsor. Tu reto: Pera de box."
      />

      <div class="reto__acciones">
        <p id="aviso" class="reto__aviso" role="status"></p>
        <button id="historia" class="boton boton--principal" type="button">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
          Compartir en mi historia
        </button>
        <button id="guardar" class="boton boton--secundario" type="button">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 4v11" />
            <path d="m7 10 5 5 5-5" />
            <path d="M5 20h14" />
          </svg>
          Guardar imagen
        </button>
      </div>

      <div class="pie">
        <p class="pie__texto">Etiquétanos en tu historia</p>
        <a class="red" href="https://www.instagram.com/conaip_mx/">
          <span class="red__contenido">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            @CONAIP_MX
          </span>
        </a>
      </div>
    </main>
    <script src="/assets/js/compartir.js" defer></script>
  </body>
</html>
